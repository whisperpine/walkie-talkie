<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/src/main.ts" defer></script>
    <title>Walkie Talkie</title>
  </head>
  <body class="flex min-h-screen flex-col bg-gray-800 text-gray-100">
    <!-- Navigation Bar -->
    <nav class="bg-gray-800 shadow-lg">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 justify-between">
          <div class="flex items-center">
            <span class="text-2xl font-bold">Walkie Talkie</span>
          </div>
          <div class="hidden space-x-4 sm:flex sm:items-center">
            <!-- <a href="#" class="hover:text-blue-400">Home</a> -->
            <a
              href="https://github.com/whisperpine/walkie-talkie"
              target="_blank"
              class="hover:text-blue-400"
            >
              GitHub
            </a>
          </div>
          <div class="flex items-center sm:hidden">
            <button
              type="button"
              class="text-gray-400 hover:text-white focus:outline-none"
            >
              <svg
                class="h-6 w-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <title>menu</title>
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16m-7 6h7"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Chat Messages Section -->
    <section
      id="message-area"
      class="mx-auto max-w-10xl flex-1 overflow-y-auto px-4 py-4 sm:px-6 lg:px-8"
    >
      <div id="chat-container" class="space-y-4">
        <!-- <div class="flex justify-end"> -->
        <!--   <div class="max-w-xs rounded-lg bg-blue-600 p-3 text-white"> -->
        <!--     Example Message (Sender) -->
        <!--   </div> -->
        <!-- </div> -->
        <!-- <div class="flex justify-start"> -->
        <!--   <div class="max-w-xs rounded-lg bg-gray-700 p-3 text-gray-100"> -->
        <!--     Example Message (Receiver) -->
        <!--   </div> -->
        <!-- </div> -->
      </div>
    </section>

    <!-- Contact Form (Sticky Bottom) -->
    <section class="sticky bottom-0 border-t border-gray-700 bg-gray-800 py-4">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <form id="message-form" class="mx-auto max-w-lg space-y-4">
          <div>
            <label for="message" class="sr-only">Message</label>
            <textarea
              id="message"
              name="message"
              rows="2"
              class="w-full resize-none rounded-lg border border-gray-600 bg-gray-700 p-3 focus:border-blue-500 focus:ring-blue-500"
              placeholder="Type your message..."
              required
            ></textarea>
          </div>
          <button
            type="submit"
            class="w-full rounded-lg bg-blue-600 px-6 py-2 text-white transition hover:bg-blue-700"
          >
            Send
          </button>
        </form>
      </div>
    </section>
  </body>
</html>
